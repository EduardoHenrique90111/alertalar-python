[project]
name = "alertalar"
version = "1.0.0"
description = "Consulta e análise de riscos de enchentes e alagamentos em imóveis e regiões, a partir de dados públicos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn>=0.40,<1",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.3,<3.4",
    "bcrypt>=4.1,<6",
    "requests>=2.32,<3",
    "python-multipart>=0.0.20,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alertalar = "alertalar.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alertalar*"]

[tool.setuptools.package-data]
"alertalar.dados" = ["*.csv.gz", "*.md"]
"alertalar.migracoes" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
